name: 카톡 연결(처음 한 번)
on:
  workflow_dispatch:
    inputs:
      code:
        description: '로그인 뒤 주소창의 code= 뒤 글자'
        required: true
permissions:
  contents: write
concurrency: kin-alert
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography
      - run: python kin_alert.py connect "$CODE"
        env:
          CODE: ${{ inputs.code }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      - run: |
          git config user.name kin-alert-bot
          git config user.email kin-alert-bot@users.noreply.github.com
          git add state
          git commit -qm "카톡 연결" && git push -q
