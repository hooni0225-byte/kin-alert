name: 지식인 새 질문 알림
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: kin-alert
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography
      - run: python kin_alert.py
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      - name: 상태 저장
        if: always()
        run: |
          git config user.name kin-alert-bot
          git config user.email kin-alert-bot@users.noreply.github.com
          git add state
          git diff --cached --quiet || (git commit -qm "상태 갱신" && git push -q)
